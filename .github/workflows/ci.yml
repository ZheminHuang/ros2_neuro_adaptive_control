name: ROS 2 Humble CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install test dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            python3-numpy \
            python3-pytest \
            ros-humble-ament-copyright \
            ros-humble-ament-flake8 \
            ros-humble-ament-pep257
      - name: Build and test package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select neuro_adaptive_control
          source install/setup.bash
          colcon test --packages-select neuro_adaptive_control
          colcon test-result --verbose
