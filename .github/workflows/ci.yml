name: ROS 2 Humble CI

env:
  ROS_LOG_DIR: /tmp/ros2_neuro_adaptive_control_ci_logs
  MPLCONFIGDIR: /tmp/ros2_neuro_adaptive_control_matplotlib

permissions:
  contents: read

on:
  push:
    branches: [main, feature/6d-nac-payload-benchmark]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install test dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            python3-numpy \
            python3-pil \
            python3-pip \
            python3-pytest \
            ros-humble-control-msgs \
            ros-humble-ament-copyright \
            ros-humble-ament-flake8 \
            ros-humble-ament-pep257 \
            ros-humble-robot-state-publisher \
            ros-humble-rviz2 \
            ros-humble-xacro
          python3 -m pip install --no-cache-dir \
            numpy==1.24.4 mujoco==3.9.0
      - name: Build and test package
        shell: bash
        run: |
          mkdir -p /tmp/neuro_adaptive_control_ci/src/neuro_adaptive_control
          cp -a "${GITHUB_WORKSPACE}/." \
            /tmp/neuro_adaptive_control_ci/src/neuro_adaptive_control
          cd /tmp/neuro_adaptive_control_ci
          source /opt/ros/humble/setup.bash
          colcon build --packages-select neuro_adaptive_control
          source install/setup.bash
          colcon test --packages-select neuro_adaptive_control
          colcon test-result --verbose
